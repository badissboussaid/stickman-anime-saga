/* ================= الأوضاع والضربات (كما في الطقم السابق) ================= */
const POSES=[[8,55,110,35,100,28,8,-25,-8],[10,50,105,30,95,40,10,-35,-20],[10,50,105,30,95,-35,-20,40,10],[12,40,120,35,100,28,8,-25,-8],[30,92,92,35,100,50,10,-35,-10],[-5,55,110,-30,90,28,8,-25,-8],[38,45,100,92,92,55,10,-40,-20],[25,60,110,20,80,60,-10,-40,-10],[-5,60,110,150,150,25,5,-20,-5],[5,55,110,35,100,70,100,-20,-5],[-12,55,110,35,100,100,95,-25,-8],[10,80,90,-80,-90,95,92,-20,-10],[10,120,100,-110,-90,85,140,60,130],[-35,60,110,35,100,105,100,30,50],[-8,100,150,85,140,30,8,-30,-12],[-30,-20,-10,-40,-30,-10,-20,-30,-40],[0,0,0,0,0,0,0,0,0],[75,95,95,-90,-90,95,95,-20,-30],[0,170,170,-170,-170,20,5,-20,-5]];

/* ================= الصوت (WebAudio): مؤثرات + صراخ ================= */
let AU,MS,NB,SN=true;
function au(){
  if(!AU){AU=new(window.AudioContext||window.webkitAudioContext)();MS=AU.createDynamicsCompressor();const g=AU.createGain();g.gain.value=.9;MS.connect(g);g.connect(AU.destination);
    NB=AU.createBuffer(1,AU.sampleRate,AU.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AU.state==='suspended')AU.resume();
}
function noise(d,type,f,g){const t=AU.currentTime,n=AU.createBufferSource(),fl=AU.createBiquadFilter(),gn=AU.createGain();n.buffer=NB;fl.type=type;fl.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(fl);fl.connect(gn);gn.connect(MS);n.start(t);n.stop(t+d)}
function tone(f1,f2,d,g,type){const t=AU.currentTime,o=AU.createOscillator(),gn=AU.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(MS);o.start(t);o.stop(t+d)}
function snd(k){
  if(!SN||!AU)return;
  ({punch:()=>{tone(180,60,.12,.35);noise(.08,'lowpass',900,.4)},hit:()=>{tone(140,40,.2,.5);noise(.14,'lowpass',1200,.55)},block:()=>{noise(.07,'highpass',3500,.4);tone(900,500,.07,.2,'square')},whoosh:()=>noise(.18,'bandpass',1100,.18),land:()=>tone(90,40,.12,.3),ko:()=>{tone(80,25,.7,.6);noise(.5,'lowpass',500,.6)},ki:()=>{tone(300,1000,.3,.3,'sawtooth');noise(.25,'bandpass',2200,.2)},fire:()=>{noise(.4,'lowpass',2000,.45);tone(200,500,.3,.15,'sawtooth')},coin:()=>{tone(880,1320,.12,.25,'square')},bolt:()=>{noise(.35,'highpass',1500,.6);tone(120,30,.4,.4,'sawtooth')}})[k]();
}
function voice(kind,F){
  if(!SN||!AU)return;
  const t=AU.currentTime,f0=F.f0;
  const V={kiai:{d:.34,c:[1.25,1.95,1.4],v:'a',g:.6,b:1},hah:{d:.17,c:[1.2,1.5,1.2],v:'a',g:.5,b:1},hup:{d:.17,c:[1,1.5],v:'u',g:.5,b:0},ugh:{d:.25,c:[1.2,.65],v:'o',g:.6,b:1},ow:{d:.5,c:[1.8,.8],v:'a',g:.65,b:1},scream:{d:1.4,c:[1.5,2.1,1.8,.9],v:'a',g:.7,b:1,vib:1}}[kind];
  const FM={a:[800,1250,2800],o:[500,900,2400],u:[350,800,2400]}[V.v],o=AU.createOscillator();
  o.type='sawtooth';o.frequency.setValueAtTime(f0*V.c[0],t);
  V.c.forEach((m,i)=>{if(i)o.frequency.linearRampToValueAtTime(f0*m,t+V.d*i/(V.c.length-1))});
  if(V.vib){const l=AU.createOscillator(),lg=AU.createGain();l.frequency.value=6.5;lg.gain.value=f0*.09;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+V.d)}
  const g=AU.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(V.g,t+.02);g.gain.setValueAtTime(V.g,t+V.d*.65);g.gain.linearRampToValueAtTime(0,t+V.d);
  const post=AU.createGain();post.gain.value=2.6;g.connect(post);post.connect(MS);
  FM.forEach((fr,i)=>{const b=AU.createBiquadFilter();b.type='bandpass';b.frequency.value=fr*(kind==='scream'?1.15:1);b.Q.value=7+i*3;const fg=AU.createGain();fg.gain.value=[1,.7,.35][i];o.connect(b);b.connect(fg);fg.connect(g)});
  if(V.b)noise(Math.min(.12,V.d),'bandpass',2200,.35);
  o.start(t);o.stop(t+V.d+.05);
}

/* ================= رسم الشخصية (تصميم لكل شخصية: شعر/عصابة/عقدة/خرز/ذيل + سلاح + هالة) ================= */
function hairFx(g,ch,hd,ln,sur){
  const c=sur?'#ffe45c':ch.hc,[x,y]=hd;g.fillStyle=c;g.strokeStyle='#000';g.lineWidth=2;
  if(ch.hair==='spike'){for(let i=0;i<5;i++){g.beginPath();g.moveTo(x-12+i*6,y-10);g.lineTo(x-20+i*9-(i?0:6),y-34-(i%2)*8);g.lineTo(x-6+i*6,y-12);g.fill();g.stroke()}}
  else if(ch.hair==='band'){g.strokeStyle=ch.ac;g.lineWidth=5;g.beginPath();g.arc(x,y,15,Math.PI*1.1,Math.PI*1.95);g.stroke();g.lineWidth=4;for(let k=0;k<2;k++){g.beginPath();g.moveTo(x-14,y-6);g.quadraticCurveTo(x-34,y-6+k*10+Math.sin(tm*8+k)*6,x-52,y+k*14+Math.sin(tm*7+k)*8);g.stroke()}}
  else if(ch.hair==='knot'){g.beginPath();g.arc(x-2,y-22,8,0,7);g.fill();g.stroke();g.fillStyle=ch.ac;g.fillRect(x-14,y-6,28,5)}
  else if(ch.hair==='bald'){g.fillStyle=ch.ac;for(let i=0;i<7;i++){const a=Math.PI*(.15+i*.12);g.beginPath();g.arc(x-Math.cos(a)*14,y+16+Math.sin(a)*8,3.2,0,7);g.fill()}}
  else{g.strokeStyle=c;g.lineWidth=7;g.beginPath();g.moveTo(x-10,y-8);g.bezierCurveTo(x-34,y-14+Math.sin(tm*6)*5,x-40,y+14,x-26+Math.sin(tm*5)*8,y+34);g.stroke();g.strokeStyle='#000';g.lineWidth=1.5;g.stroke()}
}
function fig(F,ink,al,g,fy){
  g=g||ctx;fy=fy===undefined?FY:fy;
  const p=F.p,L=34,ch=F.ch,pt=(x,y,a,l)=>[x+Math.sin(rad(a))*l,y+Math.cos(rad(a))*l];
  g.save();g.globalAlpha=al||1;
  const lie=cl(-F.rot/90,0,1)*74*(1-cl(F.air/74,0,1));
  g.translate(F.x,fy-F.air+lie);g.scale(F.face*F.sx,F.sy);
  const hy=-Math.max(20,L*Math.cos(rad(p[5]))+L*Math.cos(rad(p[6])),L*Math.cos(rad(p[7]))+L*Math.cos(rad(p[8])));
  if(F.rot){const cy=hy-28;g.translate(0,cy);g.rotate(rad(F.rot));g.translate(0,-cy)}
  const ln=rad(p[0]),nx=Math.sin(ln)*56,ny=hy-Math.cos(ln)*56,sx=nx-Math.sin(ln)*6,sy=ny+Math.cos(ln)*6;
  const k1=pt(0,hy,p[5],L),f1=pt(k1[0],k1[1],p[6],L),k2=pt(0,hy,p[7],L),f2=pt(k2[0],k2[1],p[8],L);
  const e1=pt(sx,sy,p[1],27),h1=pt(e1[0],e1[1],p[2],27),e2=pt(sx,sy,p[3],27),h2=pt(e2[0],e2[1],p[4],27);
  const ol=ink==='#000'?(F.sur>0?'#ffe45c':ch.ac):null;
  g.lineCap='round';g.lineJoin='round';
  const line=(a,w,col)=>{g.beginPath();g.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)g.lineTo(a[i][0],a[i][1]);if(ol&&!col){g.strokeStyle=ol;g.lineWidth=w+4;g.stroke()}g.strokeStyle=col||ink;g.lineWidth=w;g.stroke()};
  line([[sx,sy],e2,h2],7);line([[0,hy],k2,f2],8);line([[0,hy],k1,f1],8);line([[0,hy],[nx,ny]],9);line([[sx,sy],e1,h1],8);
  const hd=[nx+Math.sin(ln)*14,ny-Math.cos(ln)*14];
  if(ol){g.fillStyle=ol;g.beginPath();g.arc(hd[0],hd[1],17.5,0,7);g.fill()}
  g.fillStyle=ink;g.beginPath();g.arc(hd[0],hd[1],15,0,7);g.fill();
  if(ol)hairFx(g,ch,hd,ln,F.sur>0);
  const t=F.wpn.t;
  if(t&&ol){
    const dir=(a,len,from)=>{const r=rad(a);return[[from[0],from[1]],[from[0]+Math.sin(r)*len,from[1]+Math.cos(r)*len]]};
    if(t==='sword'){const s=dir(p[2],100,h1);line(s,8,'#000');line(s,5,'#e8f0f8');line([[h1[0]+Math.sin(rad(p[2]))*10-Math.cos(rad(p[2]))*9,h1[1]+Math.cos(rad(p[2]))*10+Math.sin(rad(p[2]))*9],[h1[0]+Math.sin(rad(p[2]))*10+Math.cos(rad(p[2]))*9,h1[1]+Math.cos(rad(p[2]))*10-Math.sin(rad(p[2]))*9]],4,'#c9a227')}
    else if(t==='staff'){const r=rad(p[2]),s=[[h1[0]-Math.sin(r)*70,h1[1]-Math.cos(r)*70],[h1[0]+Math.sin(r)*95,h1[1]+Math.cos(r)*95]];line(s,9,'#000');line(s,6,'#8a5a2b')}
    else{[[h1,p[2]],[h2,p[4]]].forEach(([h,a])=>{const s=dir(a,56,h);line(s,7,'#000');line(s,4,'#e8f0f8')})}
  }
  g.restore();
}

const mkF=(i,ch,human,o)=>({i,ch,human,f0:ch.f0,x:i?980:300,vx:0,air:0,vyu:0,face:i?-1:1,mx:o.hp,hp:o.hp,dm:o.dm,sp:o.sp,en:o.en||0,sur:o.sur||0,wpn:o.wpn||WPN[0],perks:o.perks||{},st:'idle',mv:null,mt:0,sg:-1,hit:0,t:0,inv:0,q:null,base:POSES[0],p:POSES[0],rot:0,sx:1,sy:1,sq:0,wk:0,bt:0,burn:0,dj:0,ad:0,asp:1,spd:0,dealt:0,gh:[],ai:{t:0,act:'walk',blk:0,k:o.ai||1}});

    else{ctx.strokeStyle='#fff';ctx.shadowColor='#ff3df2';ctx.shadowBlur=30;ctx.lineWidth=10;ctx.beginPath();let x=b.x,y=-300;ctx.moveTo(x,y);while(y<FY){x=b.x+rnd(-30,30);y+=60;ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0}});
}

/* ================= الرسم ================= */
function draw(){
  const inv=impact>0,ink=inv?'#fff':'#000',d=Math.abs(A.x-B.x),z=cl(1.3-d/1500,1,1.3),m=(A.x+B.x)/2,fx=cl(m,W/(2*z),W-W/(2*z)),fy=FY-130;
  ctx.fillStyle=inv?'#000':'#fff';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-fx,-fy);
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(inv){ctx.fillStyle='#000';ctx.fillRect(-500,-500,W+1000,1500)}else stageBg();
  ctx.strokeStyle=inv?'#fff':ST.pal[3];ctx.lineCap='round';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-200,FY);ctx.lineTo(W+200,FY);ctx.stroke();
  ctx.lineWidth=3;MK.forEach(k=>k.ls.forEach(l=>{ctx.beginPath();ctx.moveTo(k.x,FY);ctx.lineTo(k.x+l[0],FY+l[1]);ctx.stroke()}));
  if(!inv){ctx.fillStyle='rgba(0,0,0,.25)';[A,B].forEach(F=>{ctx.beginPath();ctx.ellipse(F.x,FY+9,Math.max(10,38-F.air*.12),7,0,0,7);ctx.fill()});
    ctx.globalCompositeOperation='lighter';[A,B].forEach(F=>{if(F.sur>0||F.en>=100){const r=F.sur>0?120:80,gg=ctx.createRadialGradient(F.x,FY-F.air-80,8,F.x,FY-F.air-80,r),c=F.sur>0?'#ffe45c':F.ch.ac;gg.addColorStop(0,c+'99');gg.addColorStop(1,c+'00');ctx.fillStyle=gg;ctx.fillRect(F.x-r,FY-F.air-80-r,r*2,r*2)}});ctx.globalCompositeOperation='source-over'}
  [A,B].forEach(F=>{F.gh.forEach((q,i)=>fig(q,ink,.08+i*.05));
    if(Math.abs(F.vx)>380){ctx.strokeStyle=inv?'#fff':'#000';ctx.lineWidth=2;const s=Math.sign(F.vx);for(let i=0;i<6;i++){const y=FY-rnd(20,150)-F.air,x=F.x-s*rnd(40,150);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*rnd(50,120),y);ctx.stroke()}}});
  fig(A,ink);fig(B,ink);
  [A,B].forEach(F=>{if(F.burn>0){ctx.fillStyle='#ff7a1a';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(F.x+rnd(-14,14),FY-F.air-rnd(10,120),rnd(3,6),0,7);ctx.fill()}}});
  ctx.globalCompositeOperation='lighter';
  PJ.forEach(p=>{const gg=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r*1.8);gg.addColorStop(0,'#fff');gg.addColorStop(.4,p.col);gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.fillRect(p.x-p.r*2,p.y-p.r*2,p.r*4,p.r*4);
    if(p.k==='shuri'){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-9,p.y);ctx.lineTo(p.x+9,p.y);ctx.moveTo(p.x,p.y-9);ctx.lineTo(p.x,p.y+9);ctx.stroke()}});
  ctx.globalCompositeOperation='source-over';
  ctx.lineWidth=2.5;P.forEach(q=>{ctx.strokeStyle=inv?'#fff':(q.col||'#fff');ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*1.6,q.y-q.vy*1.6);ctx.stroke()});ctx.globalAlpha=1;
  HB.forEach(h=>{const u=h.l/h.m;ctx.fillStyle=inv?'#fff':(h.col||'#fff');
    for(let i=0;i<20;i++){const a=i/20*6.283+h.sd,len=(40+(i*37%60))*h.s*(1.25-u*.5);ctx.beginPath();ctx.moveTo(h.x+Math.cos(a)*10,h.y+Math.sin(a)*10);ctx.lineTo(h.x+Math.cos(a+.06)*len,h.y+Math.sin(a+.06)*len);ctx.lineTo(h.x+Math.cos(a-.06)*len,h.y+Math.sin(a-.06)*len);ctx.fill()}
    if(h.star){ctx.fillStyle=inv?'#000':'#fff';ctx.strokeStyle=inv?'#fff':'#000';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*6.283+h.sd,r=(i%2?9:30)*h.s*(.6+.4*u);ctx.lineTo(h.x+Math.cos(a)*r,h.y+Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}});
  stageFx();ctx.restore();
  // الواجهة
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(30,10,520,64);ctx.fillRect(730,10,520,64);
  ctx.font='700 17px Tahoma,sans-serif';ctx.textBaseline='middle';
  [[A,40,'left'],[B,1240,'right']].forEach(([F,x,al])=>{
    ctx.textAlign=al;ctx.fillStyle='#fff';ctx.fillText(F.ch.n+(F.sur>0?' ⚡':'')+(F.wpn.t?' · '+F.wpn.n:''),x,24);
    ctx.fillStyle='#222';ctx.fillRect(al==='left'?40:740,34,500,18);ctx.fillRect(al==='left'?40:740,57,500,8);
    ctx.fillStyle=F.ch.ac;const hw=500*cl(F.hp/F.mx,0,1);ctx.fillRect(al==='left'?40:1240-hw,34,hw,18);
    ctx.fillStyle=F.en>=100?'#fff':'#ffe45c';const ew=500*F.en/100;ctx.fillRect(al==='left'?40:1240-ew,57,ew,8)});
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(ST.n,640,40);
}
function frame(now){
  const rdt=Math.min(.05,(now-lastT)/1000||0);lastT=now;tm+=rdt;
  ts+=((now<slowEnd?.2:1)-ts)*.25;
  if(running&&!paused){
    let dt=rdt*ts;if(hs>0){hs-=rdt;dt=0}
    if(dt>0){
      stageUpd(dt);updF(A,B,dt,A.human?humanI(A):aiI(A,B,dt));updF(B,A,dt,aiI(B,A,dt));updPJ(dt);koCheck();
      P.forEach(q=>{q.x+=q.vx*60*dt;q.y+=q.vy*60*dt;q.vx*=.96;q.vy*=.96;q.l-=dt});P=P.filter(q=>q.l>0);
      HB.forEach(h=>h.l-=dt);HB=HB.filter(h=>h.l>0);
    }
    impact=Math.max(0,impact-rdt);shake=Math.max(0,shake-rdt*30);
    if(winner&&endT>0){endT-=rdt;if(endT<=0)finish()}
  }
  draw();requestAnimationFrame(frame);
}
/* ================= تدفق اللعبة ================= */
function startStage(i,quiet){
  cur=i;const s=STG[i];ST={...s,id:i,g:i===5?.55:1,fr:i===3?.25:.002};SG={t:0,nx:1.2};CN=[];BT=[];PJ=[];P=[];HB=[];MK=[];wind=0;hs=0;shake=0;impact=0;slowEnd=0;ts=1;winner=null;endT=0;
  const ch=CH[SV.cur],u=SV.up,oc=CH[s.opp],k=s.k;
  A=mkF(0,ch,true,{hp:ch.hp*(1+.1*u.hp),dm:ch.dmg*(1+.08*u.pw),sp:ch.spd*(1+.05*u.sd),wpn:WPN[SV.eq],perks:SV.perks});
  B=mkF(1,oc,false,{hp:oc.hp*(1+.17*k),dm:oc.dmg*(1+.1*k),sp:oc.spd*(1+.02*k),wpn:i?WPN[(i%3)+1]:WPN[0],ai:k,sur:i===5?1e9:0,en:i>=3?40:0});
  if(!quiet){au();running=true;paused=false;$('ov').classList.add('hide')}
  $('sname').textContent=(i+1)+'. '+s.n;updTop();
}
function updTop(){$('coins').textContent='🪙 '+Math.floor(SV.coins)}
function finish(){
  running=false;const win=winner===A,rw=win?STG[cur].rw+Math.floor(A.dealt*1.5):Math.floor(A.dealt*.8);
  SV.coins+=rw;if(win&&cur+1===SV.stage&&SV.stage<6)SV.stage++;save();updTop();
  const next=win&&cur<5;
  $('ov').innerHTML=`<div class="box"><h1>${win?'🏆 فزت!':'💥 هُزمت'}</h1><p>${win?(cur===5?'هزمت سيّد المصير وأتممت الملحمة!':'مرحلة جديدة فُتحت.'):'طوّر مهاراتك من المتجر ثم حاول من جديد.'}</p><p class="coin">ربحت 🪙 ${rw}</p>
  <div class="tabs">${next?'<button class="go" data-a="go:'+(cur+1)+'">المرحلة التالية ←</button>':''}<button data-a="go:${cur}">إعادة</button><button data-a="tab:shop">🛒 المتجر</button><button data-a="tab:fight">☰ القائمة</button></div></div>`;
  $('ov').classList.remove('hide');
}
/* ================= القوائم ================= */
function menu(tab){
  tab=tab||'fight';running=false;const ov=$('ov');ov.classList.remove('hide');updTop();
  const tabs=[['fight','⚔️ القتال'],['chars','🧑‍🎤 الشخصيات'],['shop','🛒 المتجر'],['help','🎮 التحكم']];
  let h='<div class="box"><h1>ملحمة الستيكمان</h1><div class="tabs">'+tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab:${t[0]}">${t[1]}</button>`).join('')+'</div><div class="coin">🪙 '+Math.floor(SV.coins)+'</div>';
  if(tab==='fight')h+='<div class="list">'+STG.map((s,i)=>`<div class="item${i>=SV.stage?' lock':''}"><b>${i+1}. ${s.n}</b><small>${s.d}</small><small>الخصم: ${CH[s.opp].n}${i===5?' (زعيم)':''} · الجائزة 🪙 ${s.rw}+</small><button class="go" data-a="go:${i}" ${i>=SV.stage?'disabled':''}>${i>=SV.stage?'🔒 مقفلة':'قاتل'}</button></div>`).join('')+'</div>';
  else if(tab==='chars')h+='<div class="list">'+CH.map((c,i)=>`<div class="item${SV.cur===i?' sel':''}"><canvas class="pv" data-i="${i}" width="90" height="125"></canvas><b>${c.n}</b><small>${c.d}</small><small>صحة ${c.hp} · ضرر ${c.dmg} · سرعة ${c.spd}</small><button class="${SV.chars[i]?'':'go'}" data-a="char:${i}" ${!SV.chars[i]&&SV.coins<c.cost?'disabled':''}>${SV.chars[i]?(SV.cur===i?'مختار ✓':'اختيار'):'شراء 🪙 '+c.cost}</button></div>`).join('')+'</div>';
  else if(tab==='shop'){
    h+='<h3>الأسلحة</h3><div class="list">'+WPN.map((w,i)=>`<div class="item${SV.eq===i?' sel':''}"><b>${w.n}</b><small>${w.d2}</small><button class="${SV.wp[i]?'':'go'}" data-a="wp:${i}" ${!SV.wp[i]&&SV.coins<w.cost?'disabled':''}>${SV.wp[i]?(SV.eq===i?'مجهّز ✓':'تجهيز'):'شراء 🪙 '+w.cost}</button></div>`).join('')+'</div>';
    h+='<h3>المهارات الجديدة</h3><div class="list">'+PERKS.map(p=>`<div class="item${SV.perks[p[0]]?' sel':''}"><b>${p[1]}</b><small>${p[2]}</small><button class="go" data-a="perk:${p[0]}" ${SV.perks[p[0]]||SV.coins<p[3]?'disabled':''}>${SV.perks[p[0]]?'مُكتسبة ✓':'تعلّم 🪙 '+p[3]}</button></div>`).join('')+'</div>';
    h+='<h3>التطوير</h3><div class="list">'+UPG.map(u=>{const l=SV.up[u[0]],c=(l+1)*120;return`<div class="item"><b>${u[1]} (${l}/5)</b><small>${u[2]}</small><button class="go" data-a="up:${u[0]}" ${l>=5||SV.coins<c?'disabled':''}>${l>=5?'أقصى مستوى':'ترقية 🪙 '+c}</button></div>`}).join('')+'</div>';
  }else h+='<p style="line-height:2;text-align:right">⌨️ الأسهم/A D: تحريك · W: قفز · S: صدّ<br>J: لكمة (اضغط ثلاثًا = كومبو) · K: ركلة (مع الاتجاه للأمام = دوّارة، بالهواء = طائرة)<br>L: ضربة علوية · I: قدرة الشخصية (تكلّف 40 طاقة) · U: انفجار القوة (100 طاقة، 8 ثوانٍ)<br>Space: تفادٍ بقلبة · Shift: انزلاق · P: إيقاف<br>📱 على الجوال استخدم الأزرار تحت الشاشة.<br>💡 اربح عملات من الضرب والفوز، واشترِ الأسلحة والمهارات والشخصيات الجديدة.</p><div class="tabs"><button data-a="snd:1">'+(SN?'🔊 الصوت يعمل':'🔇 الصوت مكتوم')+'</button><button data-a="reset:1">🗑 مسح التقدم</button></div>';
  ov.innerHTML=h+'</div>';
  ov.querySelectorAll('canvas.pv').forEach(c=>{const g=c.getContext('2d'),F=mkF(0,CH[+c.dataset.i],false,{hp:100,dm:1,sp:1});F.x=46;F.p=POSES[0];g.clearRect(0,0,90,125);fig(F,'#000',1,g,118)});
}
function act(a,v){
  au();
  if(a==='tab')return menu(v);
  if(a==='go')return startStage(+v);
  if(a==='snd'){SN=!SN;return menu('help')}
  if(a==='reset'){SV={coins:0,chars:[1,0,0,0,0],cur:0,wp:[1,0,0,0],eq:0,perks:{},up:{pw:0,hp:0,sd:0},stage:1};save();return menu('fight')}
  if(a==='char'){const i=+v;if(SV.chars[i])SV.cur=i;else if(SV.coins>=CH[i].cost){SV.coins-=CH[i].cost;SV.chars[i]=1;SV.cur=i;snd('coin')}save();return menu('chars')}
  if(a==='wp'){const i=+v;if(SV.wp[i])SV.eq=i;else if(SV.coins>=WPN[i].cost){SV.coins-=WPN[i].cost;SV.wp[i]=1;SV.eq=i;snd('coin')}save();return menu('shop')}
  if(a==='perk'){const p=PERKS.find(x=>x[0]===v);if(p&&!SV.perks[v]&&SV.coins>=p[3]){SV.coins-=p[3];SV.perks[v]=1;snd('coin')}save();return menu('shop')}
  if(a==='up'){const l=SV.up[v],c=(l+1)*120;if(l<5&&SV.coins>=c){SV.coins-=c;SV.up[v]++;snd('coin')}save();return menu('shop')}
}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const[a,v]=b.dataset.a.split(':');act(a,v)});
$('mn').onclick=()=>menu('fight');
addEventListener('keydown',e=>{
  const c=e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
  if(e.repeat)return;keys[c]=1;
  const T={KeyJ:'jab',KeyK:'kick',KeyL:'upper',KeyI:'special',KeyU:'surge',Space:'dodge',ShiftLeft:'slide',ShiftRight:'slide',ArrowUp:'jump',KeyW:'jump'}[c];if(T)taps.push({n:T,t:performance.now()});
  if(c==='KeyP'&&running)paused=!paused;
});
addEventListener('keyup',e=>keys[e.code]=0);
$('pad').querySelectorAll('button').forEach(b=>{
  const h=b.dataset.h,t=b.dataset.t;
  b.addEventListener('pointerdown',e=>{e.preventDefault();au();if(h){keys[h]=1;b.classList.add('on')}else taps.push({n:t,t:performance.now()})});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(h){keys[h]=0;b.classList.remove('on')}}));
});
startStage(0,true);menu('fight');requestAnimationFrame(frame);
</script>
</body>
